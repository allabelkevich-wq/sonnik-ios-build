# Конвейер iOS-сборки «Лунного сонника».
#
# Почему в облаке, а не на маке Аллы: с 28.04.2026 App Store принимает только
# сборки на Xcode 26, а он ставится лишь на macOS 26. На её машине Sonoma 14.7 —
# собрать локально нечем. Раннер macos-26 несёт Xcode 26.6.
#
# Запуск только по требованию: репозиторий приватный, минуты macOS считаются
# по курсу десять к одному, и автозапуск на каждый пуш сжигал бы квоту.
#   git push origin HEAD:ci/ios-build --force
# либо кнопка «Run workflow» в Actions (появляется, когда файл есть в main).
#
# Первая задача (validate) работает БЕЗ секретов — она отвечает на единственный
# важный вопрос: собирается ли приложение вообще. Вторая (release) подписывает
# архив и отправляет его в App Store Connect; включается галочкой при ручном
# запуске либо веткой со словом release. Порядок шагов и грабли — из конвейера
# YupSoul, откуда этот файл и пришёл.

name: iOS build

on:
  push:
    branches: ['ci/ios-*']
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Номер сборки для стора (пусто = BUILD_BASE или номер прогона)'
        type: string
        default: ''
      release:
        description: 'Собрать подписанный архив и отправить в App Store Connect'
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.yupsoul.sonnik
  SCHEME: App
  MARKETING_VERSION: 1.0.0

jobs:
  validate:
    name: Компиляция под симулятор
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Инструменты раннера
        run: |
          xcodebuild -version
          swift --version

      # Фронт собираем здесь же: в приложение должен попасть тот же клиент,
      # что отдаёт живой сервер, а не то, что случайно лежит в dist/ в репозитории.
      - name: Собрать клиент
        # Внутри приложения страница открыта с capacitor://localhost — относительные
        # /api/... ушли бы в никуда. Направляем запросы на живой сервер.
        env:
          VITE_API_URL: https://sonnik-app.yupsoul.ru
          # Публичный ключ SDK RevenueCat для iOS (appl_…). Без него шторка скажет
          # «покупки недоступны»: собрать можно, выпускать в стор — нет.
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: npm run build:client

      - name: Собрать app/www из сборки клиента
        run: node scripts/build-app-www.mjs

      - name: Зависимости приложения
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Синхронизация Capacitor
        working-directory: app
        run: npx cap sync ios

      # Отдельным шагом: именно здесь всплывает несовместимость версий плагинов
      # (в YupSoul на этом падала первая сборка — apple-sign-in требовал
      # capacitor-swift-pm 7.x, а RevenueCat 8.x).
      - name: Разрешить пакеты Swift
        working-directory: app/ios/App/CapApp-SPM
        run: |
          # GitHub отдаёт бинарники Facebook SDK с перебоями (504) — три попытки с паузой.
          for i in 1 2 3; do swift package resolve && break; echo "попытка $i не удалась, жду 40 с"; sleep 40; done
          swift package resolve

      - name: Настройки сборки (проверка конфигурации)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme "$SCHEME" -showBuildSettings \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|TARGETED_DEVICE_FAMILY|IPHONEOS_DEPLOYMENT_TARGET"

      - name: Компиляция (без подписи)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -40

  release:
    name: Подписанный архив и отправка в стор
    needs: validate
    if: inputs.release || contains(github.ref_name, 'release')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Проверить, что секреты заведены
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RC_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: |
          # Ровно те секреты, что читают шаги ниже. Ключ RevenueCat здесь
          # обязателен: без него в стор уехала бы сборка, где покупки молчат.
          miss=""
          [ -z "$CERT" ] && miss="$miss IOS_CERT_P12_BASE64"
          [ -z "$CERT_PW" ] && miss="$miss IOS_CERT_PASSWORD"
          [ -z "$PROFILE" ] && miss="$miss IOS_PROFILE_BASE64"
          [ -z "$ASC_KEY" ] && miss="$miss ASC_KEY_P8_BASE64"
          [ -z "$ASC_KEY_ID" ] && miss="$miss ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && miss="$miss ASC_ISSUER_ID"
          [ -z "$RC_KEY" ] && miss="$miss REVENUECAT_IOS_KEY"
          if [ -n "$miss" ]; then
            echo "Не хватает секретов:$miss"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Собрать клиент
        env:
          VITE_API_URL: https://sonnik-app.yupsoul.ru
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: npm run build:client

      - name: Собрать app/www из сборки клиента
        run: node scripts/build-app-www.mjs

      - name: Зависимости и синхронизация
        working-directory: app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx cap sync ios

      - name: Разрешить пакеты Swift
        working-directory: app/ios/App/CapApp-SPM
        run: |
          # GitHub отдаёт бинарники Facebook SDK с перебоями (504) — три попытки с паузой.
          for i in 1 2 3; do swift package resolve && break; echo "попытка $i не удалась, жду 40 с"; sleep 40; done
          swift package resolve

      - name: Импортировать сертификат в связку ключей
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          # Отдельная связка на время сборки: чужие ключи раннера не трогаем,
          # пароль случайный и живёт только внутри этого запуска.
          KEYCHAIN=build.keychain
          KC_PW=$(openssl rand -hex 20)
          security create-keychain -p "$KC_PW" $KEYCHAIN
          security set-keychain-settings -lut 3600 $KEYCHAIN
          security unlock-keychain -p "$KC_PW" $KEYCHAIN
          echo "$CERT_B64" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm -f cert.p12
          security find-identity -v -p codesigning $KEYCHAIN

      - name: Поставить провижн-профиль
        env:
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision > profile.plist
          echo "UUID: $(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)"
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)" >> $GITHUB_ENV
          echo "TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)" >> $GITHUB_ENV

      - name: Ключ App Store Connect API
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "$ASC_KEY_B64" | base64 --decode > "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Разрешить пакеты Swift (с повторами)
        working-directory: app/ios/App
        run: |
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme "$SCHEME" 2>&1 | tail -5 && break
            echo "попытка $i не удалась, жду 40 с"; sleep 40
          done

      - name: Архив
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number || vars.BUILD_BASE || github.run_number }}" \
            archive 2>&1 | tail -40
          # Подпись НЕ передаём аргументами: xcodebuild раздал бы её всем целям,
          # включая чужие Swift-пакеты — они профилей не поддерживают и роняют
          # архив. Настройки лежат у цели App в проекте (как в YupSoul).

      - name: Экспорт и отправка в App Store Connect
        run: |
          # destination=upload отправляет сборку сразу из xcodebuild, без altool.
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tail -40

      - name: Убрать ключи с раннера
        if: always()
        run: |
          rm -rf private_keys ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          security delete-keychain build.keychain || true

      - name: Выложить архив
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: |
            App.xcarchive
            export
          retention-days: 7
          if-no-files-found: warn
